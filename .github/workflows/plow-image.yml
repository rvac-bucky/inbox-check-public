name: plow-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['plow-agent/**', '.github/workflows/plow-image.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: plow-agent
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/inbox-check-plow:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/inbox-check-plow:v1
      - run: echo "IMAGE ghcr.io/${{ github.repository_owner }}/inbox-check-plow@${{ steps.build.outputs.digest }}"
